<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="keybody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="485" cy="95" r="130" fill="#34d399" opacity="0.2"/>
  <circle cx="120" cy="300" r="140" fill="#60a5fa" opacity="0.2"/>
  <ellipse cx="300" cy="310" rx="205" ry="18" fill="#0f172a" opacity="0.18"/>
  <!-- NFC Contactless Waves (Top) -->
  <path d="M275,95 A45,45 0 0,1 325,95" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M258,78 A70,70 0 0,1 342,78" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M240,61 A95,95 0 0,1 360,61" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- Gold-Plated USB Connector (Left) -->
  <rect x="95" y="166" width="78" height="68" rx="6" fill="#0f172a" stroke="url(#gold)" stroke-width="3"/>
  <g fill="url(#gold)">
    <rect x="102" y="176" width="58" height="9" rx="2"/>
    <rect x="102" y="190" width="46" height="7" rx="2"/>
    <rect x="102" y="203" width="46" height="7" rx="2"/>
    <rect x="102" y="215" width="58" height="9" rx="2"/>
  </g>
  <!-- FIDO2 Hardware Key Armored Casing -->
  <path d="M168,142 L440,142 C475,142 502,168 502,200 C502,232 475,258 440,258 L168,258 C160,258 156,252 156,244 L156,156 C156,148 160,142 168,142 Z" fill="url(#keybody)" stroke="#64748b" stroke-width="3"/>
  <!-- Keychain Eyelet Loop (Right) -->
  <circle cx="462" cy="200" r="20" fill="url(#bg)" stroke="url(#gold)" stroke-width="4"/>
  <!-- Security Shield Accent -->
  <polygon points="212,175 236,184 232,212 212,224 192,212 188,184" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2.5"/>
  <polyline points="203,200 210,207 223,192" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Biometric Capacitive Fingerprint Reader Pad -->
  <rect x="268" y="158" width="84" height="84" rx="18" fill="#090d16" stroke="url(#gold)" stroke-width="3"/>
  <!-- Fingerprint Concentric Ridges -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
    <path d="M292,216 C292,188 328,188 328,216"/>
    <path d="M284,222 C284,176 336,176 336,222"/>
    <path d="M277,208 C277,166 343,166 343,208"/>
    <path d="M301,224 C301,200 319,200 319,224"/>
    <line x1="310" y1="206" x2="310" y2="226"/>
  </g>
  <!-- Status LEDs -->
  <circle cx="385" cy="188" r="5" fill="#22c55e"/>
  <circle cx="385" cy="212" r="5" fill="#38bdf8"/>
</svg>
