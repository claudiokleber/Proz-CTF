<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="50%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="460" cy="110" r="130" fill="#34d399" opacity="0.2"/>
  <circle cx="150" cy="300" r="140" fill="#38bdf8" opacity="0.2"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="355" rx="95" ry="22" fill="#0f172a" opacity="0.2"/>
  <!-- Paracord ultralight cable -->
  <path d="M300,72 C300,35 345,35 375,15" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 3"/>
  <rect x="293" y="60" width="14" height="16" rx="4" fill="#1e293b"/>
  <!-- Outer RGB Underglow -->
  <path d="M222,150 C222,90 255,68 300,68 C345,68 378,90 378,150 L386,255 C386,320 350,352 300,352 C250,352 214,320 214,255 Z" fill="url(#rgb)" opacity="0.7"/>
  <!-- Main Mouse Body -->
  <path d="M226,152 C226,95 258,72 300,72 C342,72 374,95 374,152 L381,252 C381,314 347,344 300,344 C253,344 219,314 219,252 Z" fill="url(#shell)" stroke="#64748b" stroke-width="2"/>
  <!-- Left & Right Click separation -->
  <path d="M225,175 Q300,192 375,175" fill="none" stroke="#020617" stroke-width="3"/>
  <line x1="300" y1="72" x2="300" y2="184" stroke="#020617" stroke-width="3"/>
  <!-- Scroll Wheel Slot & RGB Wheel -->
  <rect x="287" y="96" width="26" height="58" rx="13" fill="#020617" stroke="#475569" stroke-width="1.5"/>
  <rect x="291" y="103" width="18" height="44" rx="9" fill="#1e293b" stroke="url(#rgb)" stroke-width="2.5"/>
  <line x1="293" y1="115" x2="307" y2="115" stroke="#64748b" stroke-width="2"/>
  <line x1="293" y1="125" x2="307" y2="125" stroke="#64748b" stroke-width="2"/>
  <line x1="293" y1="135" x2="307" y2="135" stroke="#64748b" stroke-width="2"/>
  <!-- DPI Buttons -->
  <rect x="293" y="160" width="14" height="10" rx="3" fill="#10b981"/>
  <rect x="293" y="173" width="14" height="8" rx="2" fill="#475569"/>
  <!-- Side thumb buttons (left) -->
  <path d="M221,175 L214,180 L213,212 L220,216 Z" fill="#06b6d4"/>
  <path d="M220,222 L213,226 L212,254 L219,258 Z" fill="#10b981"/>
  <!-- Ultralight Honeycomb Grips / RGB Logo -->
  <g fill="#0f172a" stroke="#334155" stroke-width="1.5">
    <polygon points="300,220 312,227 312,240 300,247 288,240 288,227"/>
    <polygon points="274,235 286,242 286,255 274,262 262,255 262,242"/>
    <polygon points="326,235 338,242 338,255 326,262 314,255 314,242"/>
    <polygon points="300,250 312,257 312,270 300,277 288,270 288,257" fill="#10b981" fill-opacity="0.35" stroke="#10b981"/>
    <polygon points="274,265 286,272 286,285 274,292 262,285 262,272"/>
    <polygon points="326,265 338,272 338,285 326,292 314,285 314,272"/>
    <polygon points="300,280 312,287 312,300 300,307 288,300 288,287"/>
  </g>
  <!-- Bottom RGB Accent Strip -->
  <path d="M242,315 Q300,342 358,315" fill="none" stroke="url(#rgb)" stroke-width="4" stroke-linecap="round"/>
</svg>
