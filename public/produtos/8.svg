<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ant" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="480" cy="95" r="130" fill="#06b6d4" opacity="0.18"/>
  <circle cx="120" cy="310" r="140" fill="#6366f1" opacity="0.18"/>
  <ellipse cx="300" cy="348" rx="225" ry="18" fill="#0f172a" opacity="0.2"/>
  <!-- Wi-Fi 6E Tri-Band Signal Waves -->
  <path d="M250,95 A70,70 0 0,1 350,95" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>
  <path d="M225,75 A105,105 0 0,1 375,75" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M200,55 A140,140 0 0,1 400,55" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <circle cx="300" cy="112" r="7" fill="#06b6d4"/>
  <!-- 4 High-Gain External Antennas -->
  <g fill="url(#ant)" stroke="#475569" stroke-width="1.5">
    <polygon points="118,90 132,90 140,255 112,255"/>
    <polygon points="205,72 219,72 225,245 199,245"/>
    <polygon points="381,72 395,72 401,245 375,245"/>
    <polygon points="468,90 482,90 488,255 460,255"/>
  </g>
  <!-- Cyan Accent Lines on Antennas -->
  <line x1="125" y1="108" x2="126" y2="165" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="212" y1="90" x2="212" y2="150" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="388" y1="90" x2="388" y2="150" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="475" y1="108" x2="474" y2="165" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <!-- Futuristic Angular Router Chassis -->
  <polygon points="135,235 465,235 515,295 485,332 115,332 85,295" fill="url(#body)" stroke="#64748b" stroke-width="2.5"/>
  <!-- Top Ventilation Grille Vents -->
  <polygon points="165,246 435,246 462,282 138,282" fill="#090d16"/>
  <g stroke="#334155" stroke-width="2.5" stroke-linecap="round">
    <line x1="175" y1="255" x2="165" y2="275"/>
    <line x1="195" y1="255" x2="185" y2="275"/>
    <line x1="215" y1="255" x2="205" y2="275"/>
    <line x1="235" y1="255" x2="225" y2="275"/>
    <line x1="365" y1="255" x2="375" y2="275"/>
    <line x1="385" y1="255" x2="395" y2="275"/>
    <line x1="405" y1="255" x2="415" y2="275"/>
    <line x1="425" y1="255" x2="435" y2="275"/>
  </g>
  <!-- Center Shield / WPA3 Core Emblem -->
  <polygon points="300,248 322,256 316,278 300,286 284,278 278,256" fill="#0ea5e9" opacity="0.85"/>
  <!-- Front Bevel Edge & Status LEDs -->
  <polygon points="85,295 515,295 485,332 115,332" fill="#090d16"/>
  <line x1="120" y1="295" x2="480" y2="295" stroke="#06b6d4" stroke-width="3"/>
  <g>
    <circle cx="240" cy="314" r="4" fill="#22c55e"/>
    <circle cx="264" cy="314" r="4" fill="#06b6d4"/>
    <circle cx="288" cy="314" r="4" fill="#06b6d4"/>
    <circle cx="312" cy="314" r="4" fill="#06b6d4"/>
    <circle cx="336" cy="314" r="4" fill="#a855f7"/>
    <circle cx="360" cy="314" r="4" fill="#22c55e"/>
  </g>
</svg>
