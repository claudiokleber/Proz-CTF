<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="485" cy="95" r="130" fill="#a855f7" opacity="0.18"/>
  <circle cx="115" cy="300" r="140" fill="#38bdf8" opacity="0.2"/>
  <ellipse cx="300" cy="305" rx="240" ry="16" fill="#0f172a" opacity="0.18"/>
  <!-- Green/Dark PCB Bottom Strip & DDR5 288-pin Gold Fingers -->
  <rect x="70" y="242" width="460" height="24" rx="2" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
  <!-- DDR5 Center Key Notch -->
  <circle cx="308" cy="266" r="6" fill="url(#bg)"/>
  <!-- Gold Contact Pins -->
  <g fill="#f59e0b">
    <rect x="80" y="252" width="10" height="14" rx="1"/>
    <rect x="96" y="252" width="10" height="14" rx="1"/>
    <rect x="112" y="252" width="10" height="14" rx="1"/>
    <rect x="128" y="252" width="10" height="14" rx="1"/>
    <rect x="144" y="252" width="10" height="14" rx="1"/>
    <rect x="160" y="252" width="10" height="14" rx="1"/>
    <rect x="176" y="252" width="10" height="14" rx="1"/>
    <rect x="192" y="252" width="10" height="14" rx="1"/>
    <rect x="208" y="252" width="10" height="14" rx="1"/>
    <rect x="224" y="252" width="10" height="14" rx="1"/>
    <rect x="240" y="252" width="10" height="14" rx="1"/>
    <rect x="256" y="252" width="10" height="14" rx="1"/>
    <rect x="272" y="252" width="10" height="14" rx="1"/>
    <rect x="288" y="252" width="10" height="14" rx="1"/>
    <rect x="320" y="252" width="10" height="14" rx="1"/>
    <rect x="336" y="252" width="10" height="14" rx="1"/>
    <rect x="352" y="252" width="10" height="14" rx="1"/>
    <rect x="368" y="252" width="10" height="14" rx="1"/>
    <rect x="384" y="252" width="10" height="14" rx="1"/>
    <rect x="400" y="252" width="10" height="14" rx="1"/>
    <rect x="416" y="252" width="10" height="14" rx="1"/>
    <rect x="432" y="252" width="10" height="14" rx="1"/>
    <rect x="448" y="252" width="10" height="14" rx="1"/>
    <rect x="464" y="252" width="10" height="14" rx="1"/>
    <rect x="480" y="252" width="10" height="14" rx="1"/>
    <rect x="496" y="252" width="10" height="14" rx="1"/>
    <rect x="512" y="252" width="10" height="14" rx="1"/>
  </g>
  <!-- Top RGB Diffuser Light Bar -->
  <polygon points="75,126 155,112 445,112 525,126 515,146 85,146" fill="url(#rgb)"/>
  <!-- Brushed Black Aluminum Heatspreader Body -->
  <polygon points="62,135 145,122 250,136 350,136 455,122 538,135 538,246 62,246" fill="url(#alu)" stroke="#64748b" stroke-width="2.5"/>
  <!-- Side Retention Notch Cutouts -->
  <circle cx="62" cy="195" r="9" fill="url(#bg)"/>
  <circle cx="538" cy="195" r="9" fill="url(#bg)"/>
  <!-- Brushed Metal Aggressive Fins & Geometric Accents -->
  <polygon points="95,152 215,152 195,172 95,172" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <polygon points="505,152 385,152 405,172 505,172" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <polygon points="95,228 235,228 215,208 95,208" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <polygon points="505,228 365,228 385,208 505,208" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Center Silver/RGB Emblem -->
  <polygon points="245,168 355,168 370,190 355,212 245,212 230,190" fill="#090d16" stroke="url(#rgb)" stroke-width="2.5"/>
  <line x1="255" y1="190" x2="345" y2="190" stroke="url(#rgb)" stroke-width="4" stroke-linecap="round"/>
</svg>
